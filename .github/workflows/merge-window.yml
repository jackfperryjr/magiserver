name: Merge window

# Squash-merges one Lich bump PR, at the time magiserver announced to players.
#
# There is deliberately NO schedule here. magiserver (src/lich-update-cron.ts)
# dispatches this at the 03:00 America/Chicago slot shown in the web app's restart
# banner, passing the PR number and the head commit the banner was announced for.
# GitHub's own cron runs hours late under load, and a restart at an hour nobody was
# told about is the one outcome this whole setup exists to prevent — so a missed
# night just waits for the next announced slot rather than having a backstop here.
#
# Railway deploys on merge to main, so merge time is restart time.
#
# Run it by hand (Actions → Merge window → Run workflow) to merge a bump right now;
# the same guards apply.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number of the lich-update PR to merge"
        required: true
      sha:
        description: "Head commit it was announced for (blank = whatever is there now)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Merge the lich-update PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          pr=$(gh pr view "$PR" \
                 --json number,title,state,isDraft,mergeable,labels,headRefOid,statusCheckRollup)
          echo "── #$(echo "$pr" | jq -r .number) $(echo "$pr" | jq -r .title)"

          skip() { echo "::warning::not merging #$PR: $1"; exit 0; }

          [ "$(echo "$pr" | jq -r .state)" = "OPEN" ] || skip "not open"
          [ "$(echo "$pr" | jq -r .isDraft)" = "false" ] || skip "draft"
          echo "$pr" | jq -e '[.labels[].name] | index("lich-update")' >/dev/null || skip "no lich-update label"
          # The hold may have landed after the server's last look — it still wins.
          if echo "$pr" | jq -e '[.labels[].name] | index("hold")' >/dev/null; then skip "on hold"; fi

          head=$(echo "$pr" | jq -r .headRefOid)
          if [ -n "$SHA" ] && [ "$SHA" != "$head" ]; then
            skip "head moved ($head, announced $SHA) — the server will reschedule"
          fi

          mergeable=$(echo "$pr" | jq -r .mergeable)
          [ "$mergeable" = "MERGEABLE" ] || skip "not mergeable ($mergeable)"

          # Check runs expose status/conclusion; commit statuses expose state.
          # Anything still running or not green blocks. Bot-opened PRs usually carry
          # no checks at all (see lich-update-check.yml) — their gate was the smoke
          # test that ran before the PR was opened.
          pending=$(echo "$pr" | jq '[.statusCheckRollup[]?
            | select(.__typename == "CheckRun" and .status != "COMPLETED")] | length')
          [ "$pending" = "0" ] || skip "$pending check(s) still running"
          failing=$(echo "$pr" | jq -r '[.statusCheckRollup[]?
            | (.conclusion // .state // "")
            | select(. != "SUCCESS" and . != "NEUTRAL" and . != "SKIPPED")] | length')
          [ "$failing" = "0" ] || skip "$failing check(s) not green"

          echo "merging @ ${head:0:7}"
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$head"
