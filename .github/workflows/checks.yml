name: Checks

# The gate on every PR to main. This repo had no CI at all before this, so a PR could
# only be verified by reading it.
#
# Typecheck, tests, build. There is no linter here yet; this file is where it would
# hang off once one exists.
#
# Node 20 matches production deliberately — the Dockerfile installs Node via
# nodesource setup_20.x, so CI compiling under a different major would defeat the
# point of the build step. Keep these two in sync.
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Two suites, no framework; each asserts in plain code and exits non-zero.
      #  • messaging — MessageHub end-to-end against mock sessions: presence, contact
      #    requests, delivery, the offline queue, on-disk persistence.
      #  • lootify-cron — the DST-aware clock arithmetic behind the daily dispatch,
      #    asserted against real spring-forward/fall-back dates.
      - name: Tests
        run: npm test

      # Compiles src/ to dist/ exactly as the Docker image does, so a build break is
      # caught here rather than at deploy time on Railway.
      - name: Build
        run: npm run build
